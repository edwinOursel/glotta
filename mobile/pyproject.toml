[project]
name = "glotta-mobile"
version = "0.1.0"
description = "Glotta mobile app utilities - download and serve Flutter web builds"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Edwin Oursel" }
]

dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tell hatchling to only package the Python scripts
[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = [
    "*.py",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "*.py",
    "pyproject.toml",
    "README.md",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py38"
